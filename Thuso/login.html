<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Login | Thusa
        </title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="auth-page">
            <section class="auth-card">
                <div class="brand">
                    <span class="brand-mark">T.</span><h1>Thusa</h1>
                </div>
                <p class="tagline">One Click. One Location.</p>
                    <h2>Welcome back</h2>
                    <p class="description">Login to access your Thusa dashboard.</p>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="email"><ion-icon name="mail"></ion-icon>Email address</label>
                            <input id="email" type="email" required autocomplete="email">
                        </div>
                        <div class="form-group">
                            <label for="password"><ion-icon name="lock-closed"></ion-icon>Password</label>
                            <div class="password-wrap">
                                <input id="password" type="password" required autocomplete="current-password">
                                <button id="togglePassword" class="toggle" type="button">👁</button>
                            </div>
                        </div>
                        <div class="row">
                            <label><input id="remember" type="checkbox"> Remember me</label>
                            <a href="#" id="forgot">Forgot password?</a>
                        </div>
                        <div id="message" class="message">

                        </div>
                        <button class="primary" type="submit">Login</button></form>
                        <div class="divider">Don't have an account?</div>
                        <a class="secondary" href="register.html">Create Account</a>
                    </section>
                    </main>
                    <script src="login.js"></script>
                    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
                    </body>
                    </html>
